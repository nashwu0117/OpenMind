<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="night" x1="96" y1="80" x2="928" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24505B"/>
      <stop offset="1" stop-color="#10233B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 442 -442 0 512 412)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D7780" stop-opacity=".64"/>
      <stop offset="1" stop-color="#3D7780" stop-opacity="0"/>
